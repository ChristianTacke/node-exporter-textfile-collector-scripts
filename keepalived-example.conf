# keepalived configuration examples for use with the node-exporter
# textfile collector scripts keepalived_notify.sh and keepalived.py.
#
# Two complementary approaches are provided:
#
#   A) Event-driven (keepalived_notify.sh)
#      keepalived calls the script directly on every state change.
#      Metrics appear within seconds of the transition.
#      Produces: keepalived_vrrp_state, keepalived_vrrp_priority,
#                keepalived_vrrp_state_transition_timestamp_seconds
#
#   B) Periodic polling (keepalived.py)
#      A cron job signals keepalived to write a JSON dump, then parses it.
#      Produces all metrics from approach A plus VRRP statistics counters
#      and instance metadata.
#      Requires keepalived >= 2.0 compiled with --enable-json.
#
# The two approaches can be combined: use keepalived_notify.sh for fast state
# updates and keepalived.py for periodic statistics collection.  When combining
# them, write each script's output to a different .prom file so that
# keepalived_vrrp_state does not appear twice with different label sets.
#
# ─────────────────────────────────────────────────────────────────────────────
# Installation
# ─────────────────────────────────────────────────────────────────────────────
#
# Approach A — keepalived_notify.sh:
#   install -m 755 keepalived_notify.sh /usr/local/bin/keepalived_notify.sh
#   mkdir -p /var/lib/node_exporter/textfile_collector
#
# Approach B — keepalived.py (add to /etc/cron.d/keepalived-metrics):
#   * * * * * root /usr/local/bin/keepalived.py | \
#       sponge /var/lib/node_exporter/textfile_collector/keepalived.prom
#
# ─────────────────────────────────────────────────────────────────────────────
# Two-node HA example: node1 (primary) and node2 (secondary)
# Virtual IP: 192.0.2.100/24  •  Interface: eth0  •  VRID: 51
# ─────────────────────────────────────────────────────────────────────────────

# ── node1 configuration ───────────────────────────────────────────────────────

global_defs {
    router_id node1
}

vrrp_instance VI_1 {
    state MASTER              # Initial state on node1; node2 uses BACKUP
    interface eth0
    virtual_router_id 51      # Must be unique per VRRP instance (1–255)
                              # and identical on every node in the group
    priority 100              # Higher value wins MASTER election
                              # node1: 100, node2: 90
    advert_int 1              # VRRP advertisement interval in seconds

    authentication {
        auth_type PASS
        auth_pass changeme    # Use a strong secret in production
    }

    virtual_ipaddress {
        192.0.2.100/24
    }

    # ── Approach A: event-driven notify script ──────────────────────────────
    #
    # keepalived calls the script whenever the instance changes state.
    # Arguments supplied by keepalived:
    #   $1  type      "INSTANCE" or "GROUP"
    #   $2  name      name of the VRRP instance (here: "VI_1")
    #   $3  state     new state ("MASTER", "BACKUP", or "FAULT")
    #   $4  priority  current VRRP priority
    #
    # The script writes (or overwrites) one file per instance:
    #   /var/lib/node_exporter/textfile_collector/keepalived_VI_1.prom
    notify /usr/local/bin/keepalived_notify.sh

    # ── Approach B: periodic polling ────────────────────────────────────────
    #
    # No keepalived.conf changes are required for keepalived.py.
    # Add the cron job shown above and (optionally) set json_dump_file:
    #
    # json_dump_file /var/run/keepalived.json
    #
    # Then point keepalived.py at the same path:
    #   KEEPALIVED_JSON_FILE=/var/run/keepalived.json keepalived.py | \
    #       sponge /var/lib/node_exporter/textfile_collector/keepalived.prom
}


# ── node2 configuration ───────────────────────────────────────────────────────
#
# Identical to node1 except for router_id, state, and priority.
#
# global_defs {
#     router_id node2
# }
#
# vrrp_instance VI_1 {
#     state BACKUP
#     interface eth0
#     virtual_router_id 51
#     priority 90
#     advert_int 1
#
#     authentication {
#         auth_type PASS
#         auth_pass changeme
#     }
#
#     virtual_ipaddress {
#         192.0.2.100/24
#     }
#
#     notify /usr/local/bin/keepalived_notify.sh
# }


# ─────────────────────────────────────────────────────────────────────────────
# Optional: health-check tracking script
# ─────────────────────────────────────────────────────────────────────────────
#
# vrrp_script chk_haproxy {
#     script "killall -0 haproxy"   # returns 0 if haproxy is running
#     interval 2                    # check every 2 seconds
#     weight -20                    # reduce priority by 20 on failure
# }
#
# vrrp_instance VI_1 {
#     ...
#     track_script {
#         chk_haproxy
#     }
# }
#
# When the tracking script causes a priority change, keepalived.py will
# reflect the updated effective priority in keepalived_vrrp_priority_effective.


# ─────────────────────────────────────────────────────────────────────────────
# Sync groups
# ─────────────────────────────────────────────────────────────────────────────
#
# If you use vrrp_sync_group, keepalived_notify.sh can be used as the group
# notify script as well.  State transitions of the group are reported as
# type="GROUP" in the metric labels.
#
# vrrp_sync_group VG_1 {
#     group {
#         VI_1
#         VI_2
#     }
#     notify /usr/local/bin/keepalived_notify.sh
# }
